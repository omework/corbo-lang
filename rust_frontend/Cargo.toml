[package]
name = "corbo-frontend"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toml = "0.9"
tempfile = "3"
lalrpop-util = { version = "0.23.2", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
logos = "0.16.1"
serde_json = "1.0.154"

[build-dependencies]
lalrpop = { version = "0.23.2", default-features = false, optional = true }

[features]
parser-oracle = ["dep:lalrpop", "dep:lalrpop-util"]
